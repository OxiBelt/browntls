[package]
name = "browntls-tokio"
description = "Asynchronous TLS streams for Tokio, built on browntls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Kept unpublished like the rest of the workspace until the release
# prerequisites in docs/Maintenance.md are met; the metadata below is complete
# so that flipping this is the only manifest change publishing needs.
publish.workspace = true
documentation = "https://docs.rs/browntls-tokio"
readme = "README.md"
keywords = ["tls", "tokio", "async", "ssl", "browntls"]
categories = ["asynchronous", "cryptography", "network-programming"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native", "tls12", "logging", "prefer-post-quantum", "coop"]
# Take part in Tokio's cooperative scheduling (`tokio::task::coop`), which
# Tokio offers with its `rt` feature only. `rt` adds no dependency, and any
# application that runs a Tokio runtime enables it already.
coop = ["tokio/rt"]
# Fetch certificate status (OCSP) responses for connections that wait for
# one, through an HTTP callback of the application, and keep a server's
# stapled response fresh (the `revocation` module). The deadlines need
# Tokio's `time` feature, which adds no dependency.
ocsp = ["tokio/time"]
# Datagram transport and protocol timers; the runtime belongs to the caller.
dtls = ["tokio/net", "tokio/time"]
# Feature pass-through to `browntls-core`; see its manifest for what each does.
native = ["browntls-core/native"]
rustcrypto = ["browntls-core/rustcrypto"]
tls12 = ["browntls-core/tls12"]
logging = ["browntls-core/logging"]
prefer-post-quantum = ["browntls-core/prefer-post-quantum"]
zlib = ["browntls-core/zlib"]
brotli = ["browntls-core/brotli"]
zstd = ["browntls-core/zstd"]

[dependencies]
browntls-core = { workspace = true, features = ["std"] }
# The I/O traits (`AsyncRead`, `AsyncWrite`, `AsyncBufRead`, `ReadBuf`), which
# need no tokio feature: the runtime is the caller's. The `coop` feature adds
# `rt` for the task budget.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
# Certificates generated at test run time (no committed private keys).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Interoperability oracle: tokio-rustls over rustls with the ring provider.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"

[[test]]
name = "revocation"
required-features = ["ocsp"]

[lints]
workspace = true
