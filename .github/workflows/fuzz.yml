name: Fuzz

# Coverage-guided fuzzing of the public API, one matrix job per fuzz target
# (or per topic), all on one x86-64 runner. fuzz/targets.toml lists the
# targets, their topics and the sources each one covers; scripts/fuzz/plan.py
# turns that into the matrix. fuzz/README.md explains the targets and how to
# reproduce a run locally.
#
# * Pull requests fuzz, for a short time, the targets whose sources or
#   harnesses changed (every target when the fuzz infrastructure changed).
# * The daily schedule fuzzes every target for longer, and keeps each
#   target's minimized corpus in the Actions cache, which later runs
#   (including pull requests) start from. Topic-granularity runs keep a
#   corpus per topic instead.
# * Manual runs choose the targets, the duration and whether a job runs one
#   target or a whole topic.
#
# The api-coverage job checks that the harnesses reach every public function
# of the library crates (scripts/fuzz/api_coverage.py).

on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      granularity:
        description: 'One job per fuzz target, or per topic (targets of a topic run one after another)'
        type: choice
        options: [target, topic]
        default: target
      targets:
        description: 'Comma-separated targets (empty: all)'
        type: string
        default: ''
      seconds:
        description: 'Fuzzing time per target, in seconds'
        type: number
        default: 600

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Instrumented builds need a nightly toolchain; pinned for reproducibility.
  FUZZ_TOOLCHAIN: nightly-2026-11-14
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  plan:
    name: Plan fuzz matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      seconds: ${{ steps.plan.outputs.seconds }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the planner and the coverage checker
        run: python3 -B -m unittest discover -s tests/scripts -p 'test_fuzz_*.py'

      - name: Check the target list
        run: python3 -B scripts/fuzz/plan.py check

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GRANULARITY: ${{ inputs.granularity }}
          TARGETS: ${{ inputs.targets }}
          SECONDS_INPUT: ${{ inputs.seconds }}
        run: |
          args=()
          case "${EVENT}" in
            pull_request)
              git diff --name-only "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changed-files"
              args+=(--changed-files "${RUNNER_TEMP}/changed-files")
              seconds=120
              ;;
            workflow_dispatch)
              args+=(--granularity "${GRANULARITY}" --targets "${TARGETS}")
              seconds="${SECONDS_INPUT}"
              ;;
            *)
              seconds=1200
              ;;
          esac
          matrix="$(python3 -B scripts/fuzz/plan.py matrix "${args[@]}")"
          echo "${matrix}" | python3 -m json.tool
          {
            echo "matrix=${matrix}"
            echo "seconds=${seconds}"
          } >> "${GITHUB_OUTPUT}"

  api-coverage:
    name: Public API reached by the harnesses
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          scripts/ci/install-rust.sh
          rustup component add llvm-tools

      - name: Run the harnesses over their seeds with coverage and check
        run: python3 -B scripts/fuzz/api_coverage.py run --work-dir "${RUNNER_TEMP}/api-coverage"

  fuzz:
    name: Fuzz ${{ matrix.name }} (x86_64)
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          scripts/ci/install-rust.sh
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal

      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-ubuntu-26.04-${{ env.FUZZ_TOOLCHAIN }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo "+${FUZZ_TOOLCHAIN}" install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Save cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ steps.cargo-fuzz.outputs.cache-primary-key }}

      # The key keeps the x86_64 part it had while the matrix also covered
      # aarch64 and riscv64, so the corpora saved since then keep restoring.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.name }}-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.name }}-x86_64-

      - name: Fuzz
        id: fuzz
        env:
          FUZZ_FINDINGS: ${{ runner.temp }}/fuzz-findings
          # Only runs that save their corpus minimize it.
          FUZZ_MINIMIZE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          SECONDS_PER_TARGET: ${{ needs.plan.outputs.seconds }}
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "${TARGETS}"
          scripts/fuzz/run-targets.sh "${SECONDS_PER_TARGET}" "${targets[@]}"

      # A failing target's input and libFuzzer log are not published: findings
      # are potential vulnerabilities and must not reach public logs or
      # artifacts (docs/Maintenance.md). run-targets.sh prints only the target,
      # the kind of finding, libFuzzer's seed, its statistics and the input's
      # SHA-256; the input is discarded with the runner, so a finding is a
      # signal to fuzz that target locally (fuzz/README.md).
      #
      # Pull requests, forks included, restore these caches, so the corpus is
      # saved only when every target of the job ran clean: the failing input
      # can be a corpus entry, and a saved corpus holding it would publish the
      # input that the public hash identifies. run-targets.sh also moves a
      # failing target's corpus out of fuzz/corpus. A failed, cancelled or
      # timed-out job keeps the corpus it restored.
      - name: Save corpus
        if: success() && steps.fuzz.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.name }}-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
