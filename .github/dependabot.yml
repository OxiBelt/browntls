version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The cargo-fuzz project is outside the workspace and has its own lockfile.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Base images of the Docker end-to-end peers and of the Kubernetes
  # revocation test (pinned by digest).
  - package-ecosystem: docker
    directories:
      - /tests/e2e/peer
      - /tests/kubernetes
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Ubuntu peers stay on the 24.04 LTS release for its OpenSSL 3.0
      # (tests/e2e/README.md), and later riscv64 Ubuntu images require RVA23,
      # which the native riscv64 runner lacks; only their digest is updated.
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
