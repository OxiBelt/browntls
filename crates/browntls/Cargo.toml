[package]
name = "browntls"
description = "A TLS 1.2 and TLS 1.3 library with a pluggable cryptography provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["std", "native", "tls12", "logging"]
std = ["alloc", "browntls-pki/std", "browntls-crypto?/std"]
alloc = []
tls12 = []
logging = ["dep:log"]
# The built-in provider backed by `browntls-crypto`.
native = ["dep:browntls-crypto"]

[dependencies]
browntls-pki = { workspace = true, features = ["alloc"] }
browntls-crypto = { workspace = true, optional = true }
log = { version = "0.4", optional = true }

[lints]
workspace = true
