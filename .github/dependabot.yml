version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Base images of the Docker end-to-end peers (pinned by digest).
  - package-ecosystem: docker
    directory: /tests/e2e/peer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
