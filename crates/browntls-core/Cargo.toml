[package]
name = "browntls-core"
description = "The TLS 1.2 and TLS 1.3 protocol implementation of browntls, with a pluggable cryptography provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["std", "native", "tls12", "logging", "prefer-post-quantum"]
std = ["alloc", "browntls-pki/std", "browntls-crypto?/std", "ruzstd?/std", "rustix?/std"]
alloc = []
tls12 = []
logging = ["dep:log"]
# Session-secret diagnostics. Omit this feature from production builds.
key-log = ["alloc", "dep:rustix"]
# Orders X25519MLKEM768 first in the default key-exchange group list.
prefer-post-quantum = []
# Built-in certificate compression (RFC 8879), one feature per algorithm.
# Each enabled algorithm joins the default compressor and decompressor lists.
zlib = ["dep:miniz_oxide"]
brotli = ["std", "dep:brotli"]
zstd = ["dep:ruzstd", "dep:twox-hash"]
# Unstable entry points for the fuzz targets in `fuzz/`; not a supported API.
fuzzing = ["std"]
# The built-in provider backed by `browntls-crypto`, whose `alloc` feature it
# needs with or without `std` (HPKE sealing and opening return vectors).
native = ["dep:browntls-crypto", "browntls-crypto/alloc"]
# A provider backed by the RustCrypto crates (used by the test-suite).
rustcrypto = [
  "dep:aes",
  "dep:aes-gcm",
  "dep:chacha20poly1305",
  "dep:sha1",
  "dep:sha2",
  "dep:hmac",
  "dep:x25519-dalek",
  "dep:p256",
  "dep:p384",
  "dep:p521",
  "dep:ed25519-dalek",
  "dep:ml-kem",
  "dep:rsa",
  "dep:getrandom",
  "dep:signature",
  "dep:zeroize",
]

[dependencies]
browntls-pki = { workspace = true, features = ["alloc"] }
browntls-crypto = { workspace = true, optional = true }
log = { version = "0.4", optional = true }

# QUIC header protection (RFC 9001 §5.4): AES-ECB on one block, ChaCha20.
aes = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }

miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"], optional = true }
brotli = { version = "9", default-features = false, features = ["std"], optional = true }
ruzstd = { version = "0.9", default-features = false, optional = true }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"], optional = true }

aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
# OCSP `CertID` digests of RFC 5019 responders only.
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, features = ["oid"], optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"], optional = true }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8", "zeroize", "alloc"], optional = true }
ml-kem = { version = "0.3", default-features = false, features = ["zeroize", "alloc"], optional = true }
# Verification only: the RustCrypto provider never signs with `rsa` (releases
# before 0.10.0 are affected by RUSTSEC-2023-0071, Marvin, in private-key operations).
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"], optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
signature = { version = "3", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process"], optional = true }

[dev-dependencies]
hex = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# `brotli` and `zlib`: an independent RFC 8879 implementation for the built-in
# certificate compressors to interoperate with.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging", "brotli", "zlib"] }
rustls-pki-types = "1"
rsa = { version = "0.10.0", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
env_logger = { version = "0.11", default-features = false }
# ML-DSA (FIPS 204): the independent oracle for the native ML-DSA
# verification algorithms (RFC 9881), and `sha2` for the certificate builder
# shared with `browntls-pki`'s tests.
ml-dsa = { version = "0.1", default-features = false }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
