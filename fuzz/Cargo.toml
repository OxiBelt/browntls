# cargo-fuzz project for browntls. It is not a member of the workspace: it
# has its own lockfile and is built with `cargo fuzz` (nightly) or checked
# with the pinned stable toolchain. See README.md.
[package]
name = "browntls-fuzz"
description = "Fuzz targets for the browntls codecs, PKI and handshake state machines"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
browntls-core = { path = "../crates/browntls-core", features = ["fuzzing", "zlib", "brotli", "zstd", "rustcrypto"] }
browntls-crypto = { path = "../crates/browntls-crypto" }
browntls-pki = { path = "../crates/browntls-pki" }
browntls-tokio = { path = "../crates/browntls-tokio", default-features = false, features = ["native", "rustcrypto", "tls12", "ocsp"] }
# The revocation harness uses in-memory I/O and a paused timer.
# The same lower bound as the workspace's (`[workspace.dependencies]`).
tokio = { version = "1.53", default-features = false, features = ["io-util", "test-util"] }
libfuzzer-sys = "0.4"
# Independent implementations used only as differential oracles by the
# crypto targets (the same set as `browntls-crypto`'s dev-dependencies).
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
shake = "0.1"
hmac = "0.13"
hkdf = "0.13"
aes = "0.9"
aes-gcm = "0.11"
cbc = "0.2"
ccm = "0.6"
chacha20poly1305 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = "3"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14", features = ["ecdh", "ecdsa"] }
p521 = { version = "0.14", features = ["ecdh", "ecdsa"] }
ml-kem = "0.3"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "aes", "chacha", "x25519", "nistp"] }
num-bigint = "0.5"
ed448-goldilocks = "0.14.0-pre.15"
x448 = { version = "0.14.0-pre.12", features = ["static_secrets"] }
# Certificates and keys for the connection targets, generated at start-up
# (no private keys are committed).
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` passes `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"

[lib]
path = "src/lib.rs"

[profile.release]
debug = "line-tables-only"

[[bin]]
name = "pki_revocation"
path = "fuzz_targets/pki_revocation.rs"
test = false
doc = false
bench = false

