[package]
name = "browntls-e2e"
description = "Command-line TLS peer used by the Docker end-to-end test matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "browntls-e2e"
path = "src/main.rs"

[features]
zstd = ["browntls/zstd"]

[dependencies]
# The facade only, as an application depends on it: `browntls::tokio` is
# `browntls-tokio`. `logging` is off: the peer installs no logger.
browntls = { path = "../browntls", default-features = false, features = ["std", "native", "tls12", "prefer-post-quantum", "tokio", "dtls", "coop"] }
# `--async`: a single-threaded runtime with TCP and timers.
tokio = { workspace = true, features = ["rt", "net", "time", "io-util"] }

[lints]
workspace = true
