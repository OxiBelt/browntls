# Fuzz targets for the GitHub Actions matrix (.github/workflows/fuzz.yml).
#
# Every `[[bin]]` in Cargo.toml has one entry here, and `scripts/fuzz/plan.py
# check` keeps the two (and `src/seeds.rs`) in step. Every target runs on the
# workflow's single x86-64 runner (ubuntu-26.04).
#
#   topic    groups targets for `granularity: topic` runs, one job per topic.
#   sources  glob patterns (repository-relative; `**` spans directories). On
#            pull requests a target runs when a changed file matches one of
#            its sources; changes to the fuzz infrastructure run every target.
#   args     extra libFuzzer arguments.
#   harness  the harness sources under fuzz/ (default: src/<target>.rs and
#            src/<target>/); fuzz_targets/<target>.rs is always included.

[targets.handshake_message]
harness = ["fuzz/src/codec.rs"]
topic = "tls-codec"
sources = ["crates/browntls-core/src/msgs/**", "crates/browntls-core/src/fuzzing.rs"]

[targets.deframer]
harness = ["fuzz/src/codec.rs"]
topic = "tls-codec"
sources = ["crates/browntls-core/src/msgs/**", "crates/browntls-core/src/fuzzing.rs"]

[targets.cert_decompress]
harness = ["fuzz/src/codec.rs"]
topic = "tls-codec"
sources = ["crates/browntls-core/src/compress.rs", "crates/browntls-core/src/msgs/**", "crates/browntls-core/src/fuzzing.rs"]
# The decompressors must never make an allocation above 4 MiB (fuzz/README.md).
args = ["-malloc_limit_mb=4"]

[targets.tls_codec]
topic = "tls-codec"
sources = ["crates/browntls-core/src/msgs/**", "crates/browntls-core/src/fuzzing.rs", "crates/browntls-core/src/crypto/cipher.rs"]

[targets.client]
harness = ["fuzz/src/connection.rs"]
topic = "tls-connection"
sources = ["crates/browntls-core/src/**"]

[targets.server]
