[workspace]
resolver = "3"
members = ["crates/browntls", "crates/browntls-crypto"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/OxiBelt/browntls"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
indexing_slicing = "warn"
manual_assert = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.test]
opt-level = 1

[profile.bench]
debug = true
