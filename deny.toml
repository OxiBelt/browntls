# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Exceptions must be exact, justified and time-bounded (CONTRIBUTING.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: timing side channel in `rsa` 0.9 private-key operations;
  # no patched release exists. `rsa` is used only for public-key signature
  # verification: as a dev-dependency test oracle in `browntls-pki`, and for
  # verification in the optional `rustcrypto` provider. Expires 2027-01-31,
  # or earlier once the tests verify through `browntls-crypto` RSA.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key verification; expires 2027-01-31" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

# `libfuzzer-sys` bundles LLVM's libFuzzer, which is under the NCSA licence
# (the crate's licence is "(MIT OR Apache-2.0) AND NCSA"). It is a dependency
# of the cargo-fuzz project only (`fuzz/`, outside the workspace and checked
# with this file as well): development tooling that is never part of a
# browntls build. The exception names the exact version in `fuzz/Cargo.lock`,
# so an upgrade has to revisit it. Review by 2027-05-15.
exceptions = [
  { allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
