name: Rust

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  lint:
    name: Format, Clippy and docs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross C toolchains
        # Test-only dependencies (ring via rcgen) compile C code, which the
        # cross-target Clippy runs need.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-riscv64-cross

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Check formatting
        run: |
          cargo fmt --all --check
          # Shared test cases are pulled in with `include!`, which cargo fmt
          # does not follow.
          rustfmt --edition 2024 --check crates/browntls-core/tests/cases/*.rs crates/browntls-core/tests/cases/*/*.rs

      - name: Clippy (x86-64)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (aarch64)
        run: cargo clippy --workspace --all-targets --all-features --locked --target aarch64-unknown-linux-gnu -- -D warnings

      - name: Clippy (riscv64)
        run: cargo clippy --workspace --all-targets --all-features --locked --target riscv64gc-unknown-linux-gnu -- -D warnings

      # Every target, tests included, must also build without TLS 1.2.
      - name: Clippy (without tls12)
        run: cargo clippy -p browntls-core --all-targets --no-default-features --features std,native,rustcrypto,logging --locked -- -D warnings

      - name: Clippy (browntls-tokio without coop)
        run: cargo clippy -p browntls-tokio --all-targets --no-default-features --features native,tls12,logging,prefer-post-quantum --locked -- -D warnings

      # The workspace runs above enable every feature. The facade must also
      # build with each optional crate alone, with neither, without the
      # optional defaults (the tests need `native`), with the other provider
      # and without `std`.
      - name: Clippy (browntls feature sets)
        run: |
          cargo clippy -p browntls --all-targets --locked -- -D warnings
          cargo clippy -p browntls --all-targets --features tokio --locked -- -D warnings
          cargo clippy -p browntls --all-targets --features ktls --locked -- -D warnings
          cargo clippy -p browntls --all-targets --no-default-features --features std,native --locked -- -D warnings
          cargo clippy -p browntls --lib --no-default-features --features std,rustcrypto,tokio,ktls --locked -- -D warnings
          cargo clippy -p browntls --lib --no-default-features --features native --locked -- -D warnings
          cargo clippy -p browntls --lib --no-default-features --features rustcrypto --locked -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  test-x86_64:
    name: Test x86-64 (${{ matrix.name }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64-v3
            rustflags: -C target-cpu=x86-64-v3
          - name: generic dispatch
            rustflags: ''
          - name: portable only
            rustflags: --cfg browntls_force_soft
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Report CPU
        run: grep -m1 -E '^(model name|flags)' /proc/cpuinfo || true

      # browntls-ktls hands connections to the runner's kernel.
      - name: Load the kernel TLS module
        run: sudo modprobe tls

      - name: Test
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # The runner image ships OpenSSL 3: interop tests must not skip.
          BROWNTLS_OPENSSL_INTEROP: require
          # Kernel TLS is loaded above: its tests must not skip.
          BROWNTLS_KTLS_REQUIRED: '1'
        run: cargo test --workspace --all-features --locked

      # Inline assembly must not use relocations that position-independent
      # shared objects reject (e.g. PC32 against a preemptible symbol).
      - name: Link browntls-crypto as a shared library
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo rustc -p browntls-crypto --lib --locked --crate-type dylib
          cargo rustc -p browntls-crypto --lib --locked --release --crate-type dylib

  # The GitHub Arm runner implements every Armv8 extension the aarch64
  # backends use (AES, PMULL, SHA2, SHA512, SHA3), and the backend tests
  # compare each available backend with the portable code, so aarch64 runs
  # natively rather than under QEMU.
  test-aarch64:
    name: Test aarch64 (native, ${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dispatch
            rustflags: ''
          - name: portable only
            rustflags: --cfg browntls_force_soft
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Report CPU
        run: grep -m1 -E '^Features' /proc/cpuinfo || true

      - name: Load the kernel TLS module
        run: sudo modprobe tls

      - name: Test
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # The runner image ships OpenSSL 3: interop tests must not skip.
          BROWNTLS_OPENSSL_INTEROP: require
          BROWNTLS_KTLS_REQUIRED: '1'
        run: cargo test --workspace --all-features --locked

  test-riscv64:
    name: Test riscv64 (native, RISE)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Report CPU
        run: |
          grep -m1 -E '^(isa|uarch|model name)' /proc/cpuinfo || true
          cat /sys/firmware/devicetree/base/compatible 2>/dev/null | tr '\0' ' ' || true

      - name: Test
        run: cargo test --workspace --all-features --locked

  test-qemu:
    name: Test under QEMU (${{ matrix.profile }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile:
          - x86_64-max
          - riscv64-scalar
          - riscv64-zk
          - riscv64-rvv128
          - riscv64-rvv128-zvk
          - riscv64-rvv256-zvk
          - riscv64-rvv1024-zvk
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          # Statically linked user-mode QEMU where the release still packages
          # it, the dynamically linked one otherwise (scripts/cross-test.sh
          # accepts either).
          sudo apt-get install -y -qq --no-install-recommends qemu-user-static \
            || sudo apt-get install -y -qq --no-install-recommends qemu-user

      # The riscv64 profiles run static musl binaries: Ubuntu 26.04's riscv64
      # cross glibc is built for RVA23U64 and traps on the emulated CPUs
      # without vector or Zk extensions (see scripts/cross-test.sh).
      - name: Install Rust
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          case "${PROFILE}" in
            riscv64-*) scripts/ci/install-rust.sh riscv64gc-unknown-linux-musl ;;
            *) scripts/ci/install-rust.sh ;;
          esac

      - name: Test cryptographic primitives
        run: scripts/cross-test.sh "${{ matrix.profile }}" -p browntls-crypto --locked

  no-std:
    name: Build without std
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-none
          - aarch64-unknown-none
          - riscv64gc-unknown-none-elf
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh "${{ matrix.target }}"

      - name: Build browntls-crypto (no_std, no alloc)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p browntls-crypto --no-default-features --target "${{ matrix.target }}" --locked

      - name: Build browntls-pki (no_std + alloc)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build -p browntls-pki --no-default-features --target "${{ matrix.target }}" --locked

  # Cargo.lock holds the newest Tokio release, so the other jobs do not show
  # that the declared lower bound (the newest Tokio LTS line, see
  # docs/Maintenance.md) still builds and passes.
  tokio-floor:
    name: Tokio lower bound
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Select the first release of the declared lower bound
        run: |
          bound="$(sed -n 's/^tokio = { version = "\([0-9]*\.[0-9]*\)".*/\1/p' Cargo.toml)"
          test -n "${bound}"
          cargo update --package tokio --precise "${bound}.0"
          cargo tree --locked --package tokio --depth 0

      - name: Test browntls-tokio
        run: cargo test -p browntls-tokio --all-features --locked

      - name: Test browntls-tokio without cooperative scheduling
        # The default features without `coop`, which no other job builds
        # (the workspace jobs enable every feature).
        run: cargo test -p browntls-tokio --no-default-features --features native,tls12,logging,prefer-post-quantum --locked

      # `AsyncKtlsStream` drives Tokio sockets (`net`) on the runner's kernel.
      - name: Load the kernel TLS module
        run: sudo modprobe tls

      - name: Test browntls-ktls
        env:
          BROWNTLS_KTLS_REQUIRED: '1'
        run: cargo test -p browntls-ktls --all-features --locked

      - name: Build the end-to-end peer
        run: cargo build -p browntls-e2e --locked

  # The workspace jobs test `browntls` with every feature at once, where
  # another crate's features can hide one the facade fails to pass on. These
  # are the sets an application picks: the default one, each optional crate
  # alone, both, and the smallest one with a provider (no TLS 1.2, X25519
  # first).
  facade:
    name: Facade feature sets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      # `browntls::ktls` hands a connection to the runner's kernel.
      - name: Load the kernel TLS module
        run: sudo modprobe tls

      - name: Test browntls
        env:
          BROWNTLS_KTLS_REQUIRED: '1'
        run: |
          cargo test -p browntls --locked
          cargo test -p browntls --features tokio --locked
          cargo test -p browntls --features ktls --locked
          cargo test -p browntls --features tokio,ktls,ocsp --locked
          cargo test -p browntls --no-default-features --features std,native --locked

  # The fuzz targets need a nightly toolchain to be instrumented, which only
  # the Fuzz workflow (fuzz.yml) installs. This job keeps them building on the pinned toolchain
  # and runs each harness over its generated seeds (fuzz/README.md).
  fuzz-harness:
    name: Fuzz harnesses (stable build and seeds)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Check formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run the harnesses over their seeds
        run: cargo test --manifest-path fuzz/Cargo.toml --locked

  dependencies:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: scripts/ci/install-rust.sh

      - name: Install verified cargo-deny
        env:
          CARGO_DENY_VERSION: '0.21.0'
          CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
        run: |
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/cargo-deny.XXXXXX")"
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}" \
            --output "${tool_dir}/${archive}"
          printf '%s  %s\n' "${CARGO_DENY_SHA256}" "${tool_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}" --strip-components=1
          echo "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked --all-features check

      # The cargo-fuzz project is outside the workspace (fuzz/README.md).
      - name: Check the fuzz project
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check
