[package]
name = "browntls-pki"
description = "PKI types and X.509 certificate path validation for browntls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
fluent-uri = { version = "0.4.1", default-features = false }
idna = { version = "1.1", default-features = false, features = ["alloc", "compiled_data"] }

[dev-dependencies]
hex = "0.4"
# Certificate and CRL generation at test run time (no committed private keys).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Test-only `SignatureVerificationAlgorithm` implementations.
p256 = "0.14"
p384 = "0.14"
ed25519-dalek = "3"
# ML-DSA (FIPS 204) signing at test run time and the independent oracle
# behind the ML-DSA test verification algorithms (RFC 9881).
ml-dsa = { version = "0.1", default-features = false }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha2 = { version = "0.11", features = ["oid"] }
rustls-pki-types = "1"
time = "0.3"
rand = "0.10"

[lints]
workspace = true
